name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/install.sh 0.1.18 --dry-run
      - shell: pwsh
        run: ./scripts/install.ps1 -Version 0.1.18 -DryRun
      - run: npm run verify
